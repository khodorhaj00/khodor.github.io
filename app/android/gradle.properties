org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin is applied by the Flutter Gradle plugin. Built-in Kotlin is an AGP 9
# feature and is off below that anyway; kept explicit so a later AGP bump does
# not silently change how the Kotlin plugin is applied.
android.builtInKotlin=false
