name: Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'samples/**'   # the test suite reads samples/Rhino_Logo.3dm
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'samples/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Images are published only from the repository's default branch (this repo: master).
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

  image:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        # ghcr.io rejects upper-case repository paths; the owner login may contain them.
        run: echo "name=ghcr.io/${OWNER,,}/rhino-appserver" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test GET /health
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker run -d --name appserver -p 8080:8080 -e COMPUTE_URL= "$IMAGE"
          for _ in $(seq 1 30); do
            if body="$(curl -sf http://127.0.0.1:8080/health)"; then
              echo "$body"
              echo "$body" | grep -q '"ok":true'
              docker rm -f appserver > /dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::appserver did not answer GET /health within 30 s"
          docker logs appserver
          docker rm -f appserver > /dev/null
          exit 1

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Rhino .3dm meshing / glTF conversion service in front of Rhino.Compute
          cache-from: type=gha
          provenance: false
