# Rhino appserver — meshing / glTF conversion service in front of Rhino.Compute.
#
# The appserver itself runs anywhere Docker runs (this file). Rhino.Compute does NOT: it is a
# Windows-only process that needs a licensed Rhino 8 install (core-hour billing) and cannot run
# in a Linux container. Run it on a Windows VM / workstation on the same network and point
# COMPUTE_URL at it, e.g. http://192.168.1.50:5000/ (the rhino.compute front end listens on 5000
# by default). Setup guides:
#   https://developer.rhino3d.com/guides/compute/deploy-to-iis/
#   https://developer.rhino3d.com/guides/compute/configure-compute-for-production/
# The RhinoComputeKey you configure there goes into COMPUTE_API_KEY below.
#
# Copy .env.example to .env and fill in the values; every variable has a default (see README).
services:
  appserver:
    build: .
    image: ghcr.io/khodorhaj00/rhino-appserver:latest
    container_name: rhino-appserver
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      APP_API_KEY: "${APP_API_KEY:-}"
      COMPUTE_URL: "${COMPUTE_URL:-http://host.docker.internal:5000/}"
      COMPUTE_API_KEY: "${COMPUTE_API_KEY:-}"
      COMPUTE_TIMEOUT_MS: "${COMPUTE_TIMEOUT_MS:-120000}"
      COMPUTE_BATCH: "${COMPUTE_BATCH:-20}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-200}"
      MESH_QUALITY: "${MESH_QUALITY:-default}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    # host.docker.internal resolves to the Docker host on Docker Desktop; on Linux this line
    # provides it, useful when Compute runs in a Windows VM bridged onto the host's network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # rhino3dm parses whole files into WASM memory: allow roughly 3× MAX_UPLOAD_MB.
    deploy:
      resources:
        limits:
          memory: 1g
